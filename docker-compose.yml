services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: wasla_marketplace
      POSTGRES_USER: wasla
      POSTGRES_PASSWORD: local-only-change-me
    ports:
      - "5432:5432"
    volumes:
      - wasla-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wasla -d wasla_marketplace"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wasla-postgres:
