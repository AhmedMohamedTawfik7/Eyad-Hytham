<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" role="img" aria-labelledby="title description">
  <title id="title">Wasla — a delivery with more choice</title>
  <desc id="description">Bilingual concept advertisement: share a delivery, compare sample offers, and choose a driver. Not a live service.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8faf5"/>
      <stop offset="1" stop-color="#deeee5"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b806f"/>
      <stop offset="1" stop-color="#07564e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#17312e" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1080" height="1350" rx="46" fill="url(#sky)"/>
  <circle cx="944" cy="142" r="220" fill="#efbd58" opacity=".17"/>
  <circle cx="125" cy="1060" r="255" fill="#a5d1b7" opacity=".22"/>
