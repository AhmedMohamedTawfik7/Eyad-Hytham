    <text x="94" y="44" fill="#17312e" font-family="Inter, Segoe UI, sans-serif" font-size="41" font-weight="760" letter-spacing="-2">Wasla</text>
    <text x="97" y="68" fill="#087c6e" font-family="Tahoma, Arial, sans-serif" font-size="19" font-weight="700" direction="rtl">وصلة</text>
  </g>
  <rect x="78" y="194" width="388" height="42" rx="21" fill="#e1f1e8"/>
  <text x="272" y="221" text-anchor="middle" fill="#08715f" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="800" letter-spacing="2">A GREATER CAIRO CONCEPT</text>
  <text x="78" y="342" fill="#17312e" font-family="Inter, Segoe UI, sans-serif" font-size="81" font-weight="780" letter-spacing="-5">Your goods,</text>
  <text x="78" y="433" fill="#17312e" font-family="Inter, Segoe UI, sans-serif" font-size="81" font-weight="780" letter-spacing="-5">your choice.</text>
  <text x="82" y="493" fill="#627773" font-family="Inter, Segoe UI, sans-serif" font-size="27">Share the route. Compare sample driver offers.</text>
  <text x="82" y="540" fill="#627773" font-family="Tahoma, Arial, sans-serif" font-size="29" direction="rtl">شارك المسار، وقارن عروض السائقين التجريبية</text>
  <g filter="url(#shadow)">
