  <text x="234" y="1198" text-anchor="middle" fill="#fff" font-family="Inter, Segoe UI, sans-serif" font-size="21" font-weight="800">EXPLORE THE CONCEPT</text>
  <text x="80" y="1280" fill="#5c6e66" font-family="Inter, Segoe UI, sans-serif" font-size="17">Concept preview only · No live drivers, offers, availability or payments.</text>
  <text x="82" y="1313" fill="#5c6e66" font-family="Tahoma, Arial, sans-serif" font-size="19" direction="rtl">معاينة توضيحية فقط · لا توجد رحلات أو عروض أو مدفوعات فعلية</text>
