<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" role="img" aria-labelledby="title description">
  <title id="title">Wasla Greater Cairo delivery launch campaign</title>
  <desc id="description">A launch advertisement for connecting Cairo customers with delivery drivers. App concept preview, not a live service.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7f5"/>
      <stop offset="1" stop-color="#dcebe5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#17312e" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1080" height="1350" rx="42" fill="url(#background)"/>
  <circle cx="900" cy="200" r="210" fill="#d89b32" opacity=".14"/>
  <path d="M80 105h72v72H80z" rx="20" fill="#0b6b63"/>
  <path d="M98 155c12 0 14-10 21-21 6-10 10-16 27-16" fill="none" stroke="#fff" stroke-linecap="round" stroke-width="5"/>
  <circle cx="98" cy="155" r="5" fill="#f3bd55"/>
  <circle cx="146" cy="118" r="5" fill="#f3bd55"/>
  <text x="175" y="158" fill="#17312e" font-family="Inter, Segoe UI, sans-serif" font-size="48" font-weight="750">Wasla</text>
  <text x="80" y="255" fill="#0b6b63" font-family="Inter, Segoe UI, sans-serif" font-size="23" font-weight="750" letter-spacing="3">GREATER CAIRO PILOT · APP CONCEPT</text>
  <text x="80" y="365" fill="#17312e" font-family="Inter, Segoe UI, sans-serif" font-size="82" font-weight="780">Your goods,</text>
  <text x="80" y="460" fill="#17312e" font-family="Inter, Segoe UI, sans-serif" font-size="82" font-weight="780">on their way.</text>
  <text x="84" y="525" fill="#627773" font-family="Inter, Segoe UI, sans-serif" font-size="30">A clearer way to find a local delivery driver.</text>
  <text x="84" y="572" fill="#627773" font-family="Arial, sans-serif" font-size="31">وصلة موثوقة لنقل أغراضك في القاهرة الكبرى</text>
  <g filter="url(#shadow)">
    <rect x="80" y="650" width="920" height="430" rx="32" fill="#fff"/>
    <rect x="112" y="682" width="856" height="365" rx="24" fill="#e8f3ef"/>
    <path d="M145 925c140-38 195-182 340-163 142 18 160 159 323 105" fill="none" stroke="#0b6b63" stroke-linecap="round" stroke-width="12" stroke-dasharray="2 24"/>
    <circle cx="155" cy="922" r="29" fill="#0b6b63"/>
    <circle cx="155" cy="922" r="10" fill="#fff"/>
    <path d="M803 844c0-35 27-62 61-62s61 27 61 62c0 47-61 111-61 111s-61-64-61-111" fill="#d89b32"/>
    <circle cx="864" cy="842" r="16" fill="#fff"/>
    <rect x="285" y="771" width="268" height="190" rx="18" fill="#f6e1bf" stroke="#c48938" stroke-width="5"/>
    <path d="m285 817 134 63 134-63M419 880v81M376 793h87" fill="none" stroke="#b37c34" stroke-linejoin="round" stroke-width="5"/>
    <rect x="317" y="984" width="468" height="44" rx="22" fill="#fff"/>
    <text x="551" y="1014" text-anchor="middle" fill="#17312e" font-family="Inter, Segoe UI, sans-serif" font-size="20" font-weight="650">Share the item · compare offers · follow delivery</text>
  </g>
  <rect x="80" y="1132" width="425" height="80" rx="18" fill="#0b6b63"/>
  <text x="292" y="1184" text-anchor="middle" fill="#fff" font-family="Inter, Segoe UI, sans-serif" font-size="24" font-weight="750">REQUEST A DELIVERY</text>
  <text x="80" y="1277" fill="#627773" font-family="Inter, Segoe UI, sans-serif" font-size="18">Concept preview only · Availability, prices and services are not live yet.</text>
</svg>
